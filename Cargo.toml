[workspace]
members = ["crates/alpaca-client", "crates/sec-client", "crates/reit-metrics", "crates/llm-client", "crates/ingest", "crates/derive", "crates/pipeline"]
default-members = ["crates/pipeline"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

anyhow = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
log = "0.4"
